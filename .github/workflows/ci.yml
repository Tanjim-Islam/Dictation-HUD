name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Ninja (bundled Opus build)
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # rust-cache keeps compiled crates but deletes the files sherpa-onnx-sys downloads and copies
      # into target/. Its build script only reruns when its env changes, so rerun it when they are gone.
      - name: Restore sherpa-onnx libraries
        shell: bash
        run: |
          for profile in debug release; do
            if [ ! -f "src-tauri/target/$profile/sherpa-onnx-c-api.dll" ]; then
              if [ "$profile" = release ]; then flag=--release; else flag=; fi
              cargo clean -p sherpa-onnx-sys $flag --manifest-path src-tauri/Cargo.toml
            fi
          done

      - name: Install frontend dependencies
        run: npm ci

      # tauri-build needs the bundled helper (externalBin) and its DLLs before any cargo check.
      - name: Build local speech helper
        run: npm run dev:asr

      - name: Versions match
        run: npm run check:versions

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build:frontend

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --features dictation-hud/test-helpers -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --features dictation-hud/test-helpers

      - name: Desktop build (no installer)
        run: npx tauri build --no-bundle
