name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Ninja (bundled Opus build)
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # rust-cache keeps compiled crates but deletes the files sherpa-onnx-sys downloads and copies
      # into target/. Its build script only reruns when its env changes, so rerun it when they are gone.
      - name: Restore sherpa-onnx libraries
        shell: bash
        run: |
          for profile in debug release; do
            if [ ! -f "src-tauri/target/$profile/sherpa-onnx-c-api.dll" ]; then
              if [ "$profile" = release ]; then flag=--release; else flag=; fi
              cargo clean -p sherpa-onnx-sys $flag --manifest-path src-tauri/Cargo.toml
            fi
          done

      - name: Install frontend dependencies
        run: npm ci

      - name: Versions match the tag
        run: npm run check:versions

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: 'Dictation HUD v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
