[workspace]
members = ["crates/asr-protocol", "crates/asr-helper"]

[package]
name = "dictation-hud"
version = "2.2.0"
description = "Cross-platform dictation HUD"
authors = ["You"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.9", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

uuid = { version = "1", features = ["v4", "serde"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
url = "2"
keyring = { version = "3", features = ["windows-native"] }
cpal = "0.18"
sonora = "0.2"
rubato = "0.16"
rtrb = "0.3"
tokio-util = "0.7"
hound = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
opus = "0.4"
ogg = "0.9"
asr-protocol = { path = "crates/asr-protocol" }
sha2 = "0.10"
bzip2 = "0.5"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_Media_Audio",
  "Win32_System_SystemInformation",
  "Win32_System_JobObjects",
  "Win32_Storage_FileSystem",
] }

[features]
# Exposes the fake local speech helper to integration tests.
test-helpers = []

[dev-dependencies]
tempfile = "3"
